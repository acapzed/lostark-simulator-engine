[package]
name = "simulator"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
console_error_panic_hook = { version = "0.1.7", optional = true }
# WASM에서 HashMap 성능을 위해 hashbrown 사용 고려 (선택사항)
hashbrown = { version = "0.14", features = ["serde"] }

[features]
default = ["console_error_panic_hook"]
